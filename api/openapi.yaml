---
openapi: 3.0.3
info:
  title: Haradan API
  version: 0.1.0
  description: |-
    Phase-one Haradan HTTP API contract.

    Source of truth: docs/13 (data model) and docs/14 (use-cases).
    All paths under /api. Versioned business routes use /v1.
    BO operations require canonical role=admin AND session clientContext=ADMIN_BO.
    Client-supplied role/owner/actor values are not trusted.
    Access tokens are short-lived; refresh tokens are rotated and never stored as plaintext.
    Worker/internal use-cases are not exposed as HTTP operations.
servers:
- url: "/api"
  description: API base
tags:
- name: System
  description: Health
- name: Auth
  description: Registration, login, tokens
- name: Account
  description: Authenticated self-service profile/sessions
- name: Geo
  description: Provinces and districts
- name: Catalog
  description: Public category metadata
- name: Horse
  description: Public horse selection/detail
- name: AdvertsPublic
  description: Public published advert search/detail
- name: AdvertsOwner
  description: Owner advert lifecycle
- name: Favorites
  description: User favorites
- name: Media
  description: User media upload and advert attachments
- name: BannersPublic
  description: Public active banners
- name: AdminUsers
  description: BO user administration
- name: AdminCatalog
  description: BO category and property administration
- name: AdminModeration
  description: BO advert moderation
- name: AdminMedia
  description: BO media upload
- name: AdminBanners
  description: BO banner management
- name: AdminTjk
  description: BO TJK sync administration
paths:
  "/health":
    get:
      operationId: GetHealth
      summary: GetHealth
      description: 'Exposure PUBLIC. Actor: Anonymous. No secrets'
      tags:
      - System
      x-function-id: SYS-01
      x-exposure: PUBLIC
      x-actor: Anonymous
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HealthResponse"
        '500':
          "$ref": "#/components/responses/InternalError"
        '503':
          description: DEPENDENCY_UNAVAILABLE
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      x-error-codes:
        '500':
        - INTERNAL_ERROR
        '503':
