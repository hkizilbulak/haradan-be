        format: uuid
    RunIdPath:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ErrorIdPath:
      name: errorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExpectedVersionQuery:
